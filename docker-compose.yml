services:
  falkordb:
    # Tested with graph module v4.22.1 (image digest below). Use falkordb/falkordb:latest to get the newest.
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    container_name: shutoff-falkordb
    ports:
      - "6379:6379"   # database
      - "3000:3000"   # FalkorDB Browser UI
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The ShutOff app. Open http://localhost:8080 (port 8080 so it does not clash
  # with a local `uvicorn ... --port 8000` dev server).
  app:
    build: .
    container_name: shutoff-app
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    ports:
      - "8080:8000"
    restart: unless-stopped

volumes:
  falkordb-data:
